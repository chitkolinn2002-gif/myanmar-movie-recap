<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myanmar Movie Recap</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif}
.header{background:#e50914;padding:16px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0}
.container{max-width:600px;margin:0 auto;padding:10px}
.card{background:#1f1f1f;border-radius:12px;margin:12px 0;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:12px}
.card-body h3{margin:0 0 8px 0}
.btn{background:#e50914;color:#fff;padding:10px;border-radius:8px;display:block;text-align:center;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="header">🎬 Myanmar Movie Recap</div>
<div class="container">
<div class="card">
<img src="https://via.placeholder.com/600x300/222/fff?text=Movie+1">
<div class="card-body">
<h3>ဇာတ်ကား ၁ - အချစ်ဇာတ်လမ်း</h3>
<a class="btn" href="https://facebook.com" target="_blank">Facebook မှာကြည့်ရန်</a>
</div>
</div>
<div class="card">
<img src="https://via.placeholder.com/600x300/222/fff?text=Movie+2">
<div class="card-body">
<h3>ဇာတ်ကား ၂ - ဟာသဇာတ်လမ်း</h3>
<a class="btn" href="https://facebook.com" target="_blank">Facebook မှာကြည့်ရန်</a>
</div>
</div>
</div>
</body>
</html>
